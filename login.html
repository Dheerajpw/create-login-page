<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            width: 100%;
            padding: 30px;
        }

        form {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            background: #6c5ce7;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #5849c4;
        }

        .signup {
            margin-top: 20px;
        }

        .signup a {
            color: #6c5ce7;
            text-decoration: none;
        }

        #message {
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            form {
                flex-direction: column;
                align-items: flex-start;
            }

            input {
                width: 100%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <form id="loginForm">

            <label for="email">
                Enter your email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Enter your password:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup">
            <a href="../signup/signup.html">
                New User - Signup Now
            </a>
        </div>

        <div id="message"></div>

    </div>

    <script>
        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value.trim();

                const loginData = {
                    email: email,
                    password: password
                };

                console.log(loginData);

                try {
                    const response = await fetch(
                        "http://localhost:3000/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(loginData)
                        }
                    );

                    const data = await response.json();

                    document.getElementById("message").textContent =
                        data.message;

                } catch (error) {
                    console.log(error);

                    document.getElementById("message").textContent =
                        "Network Error";
                }
            });
    </script>

</body>
</html>
